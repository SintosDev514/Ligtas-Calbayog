<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#F1F5F9}
#map{width:100%;height:100%}
.maplibregl-map{font-family:sans-serif}
.maplibregl-ctrl-attrib{font-size:9px !important;background:rgba(255,255,255,0.7) !important}
.maplibregl-ctrl-group{display:none !important}
.mb-credit{position:absolute;right:2px;bottom:2px;font-size:9px;color:rgba(30,41,59,0.6);background:rgba(255,255,255,0.75);padding:1px 6px;border-radius:6px;pointer-events:none;z-index:2;font-family:sans-serif}
.marker{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.35);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:visible}
.img-marker{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:0}
.marker-img-wrap{width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid #fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.35);position:relative;z-index:1}
.marker-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.img-pulse{position:absolute;top:50%;left:50%;width:30px;height:30px;border-radius:50%;background:rgba(239,68,68,0.45);transform:translate(-50%,-50%);animation:img-pulse-r 2s ease-out infinite;z-index:0}
@keyframes img-pulse-r{0%{opacity:0.7;transform:translate(-50%,-50%) scale(0.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}}
.marker svg{display:block}
.pin{position:relative;width:34px;height:34px;line-height:0;filter:drop-shadow(0 2px 5px rgba(0,0,0,0.4))}
.pin-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:currentColor;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.pin-head svg{display:block}
.pin-point{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid currentColor}
@keyframes pin-pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)}100%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}
.pin-animate{animation:pin-pulse 1.4s ease-out infinite}
@keyframes emergency-pulse-1{0%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)}100%{box-shadow:0 0 0 16px rgba(239,68,68,0)}}
@keyframes emergency-glow{0%,100%{filter:drop-shadow(0 0 4px rgba(239,68,68,0.4))}50%{filter:drop-shadow(0 0 10px rgba(239,68,68,0.7))}}
@keyframes user-pulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,0.5)}70%{box-shadow:0 0 0 12px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
@keyframes user-ring{0%{transform:scale(0.4);opacity:0.6}100%{transform:scale(1.6);opacity:0}}
.marker-animate{animation:emergency-pulse-1 1.4s ease-out infinite,emergency-glow 2s ease-in-out infinite}
.user-location-wrap{position:relative;width:24px;height:24px;display:flex;align-items:center;justify-content:center;animation:user-pulse 2.5s infinite}
.location-ring{position:absolute;width:100%;height:100%;border-radius:50%;background:rgba(59,130,246,0.28);animation:user-ring 2s ease-out infinite}
.user-dot{position:relative;width:16px;height:16px;border-radius:50%;background:#1E6BFF;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
.maplibregl-popup-content{font-size:12px;padding:8px 10px;border-radius:8px;font-family:sans-serif;max-width:220px}
.maplibregl-popup-close-button{font-size:16px;padding:2px 6px}
</style>
</head>
<body>
<div id="map"></div>
<div id="mb-status" style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font:600 13px/1.5 sans-serif;color:#475569;background:#F1F5F9;z-index:10;pointer-events:none;box-sizing:border-box">Loading map, please wait...</div>
<script>
window.onerror = function(m, src, line, col) {
  try { var el = document.getElementById('mb-status'); if (el) el.textContent = 'SCRIPT ERROR: ' + m + ' (line ' + line + ')'; } catch(e) {}
};
(function(){
function mbStatus(msg) {
  var el = document.getElementById('mb-status');
  if (el) el.textContent = msg;
}
mbStatus('Loading map, please wait...');

function loadEngine(done) {
  var srcs = [
    'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js',
    'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js'
  ];
  var i = 0;
  var busy = false;
  function ready() { return !!window.maplibregl; }
  function step() {
    if (ready()) { done(); return; }
    if (busy) return;
    if (i < srcs.length) {
      var s = document.createElement('script');
      s.src = srcs[i++];
      var finished = false;
      function next() { if (finished) return; finished = true; busy = false; setTimeout(step, 0); }
      s.onload = function() { if (ready()) { busy = false; done(); return; } next(); };
      s.onerror = function() { next(); };
      busy = true;
      document.head.appendChild(s);
      setTimeout(function() { if (ready()) { busy = false; done(); return; } next(); }, 5000);
    } else {
      mbStatus('Map engine (MapLibre GL) could not load on this device. Check that unpkg.com / jsdelivr.net are reachable from this device\'s internet connection.');
    }
  }
  setTimeout(step, 0);
}
loadEngine(function() {
function startMap() {
var hasGL = (function() {
  try {
    var cv = document.createElement('canvas');
    return !!(cv.getContext('webgl') || cv.getContext('experimental-webgl'));
  } catch(e) { return false; }
})();
if (!hasGL) {
  mbStatus('WebGL is not available in this browser/WebView, so the map cannot draw.');
  return;
}
var OSM_FALLBACK = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
maplibregl.accessToken = 'none';
var CARTO_LIGHT = 'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png';
var CARTO_DARK = 'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png';
var ESRI_SAT = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

var STYLE_MAP = {
  light: CARTO_LIGHT,
  dark: CARTO_DARK,
  satellite: ESRI_SAT
};

function attributionFor(url) {
  if (url.indexOf('api.mapbox.com') > -1) return '&copy; Mapbox';
  if (url.indexOf('cartocdn') > -1) return '&copy; CARTO';
  if (url.indexOf('arcgis') > -1 || url.indexOf('ArcGIS') > -1) return '&copy; Esri';
  return '&copy; OpenStreetMap';
}

function makeStyle(url) {
  return {
    version: 8,
    sources: {
      basemap: { type: 'raster', tiles: [url], tileSize: 256, attribution: attributionFor(url), maxzoom: 19 }
    },
    layers: [
      { id: 'basemap-layer', type: 'raster', source: 'basemap' }
    ]
  };
}

var map;
try {
  map = new maplibregl.Map({
    container: 'map',
    style: makeStyle(STYLE_MAP.satellite),
    center: [124.6, 12.07],
    zoom: 11,
    minZoom: 1,
    maxZoom: 19,
    maxPitch: 0,
    pitchWithRotate: false,
    touchPitch: false,
    dragRotate: false,
    attributionControl: false,
    renderWorldCopies: false
  });
  window.__map = map;
} catch(e) {
  mbStatus('Map failed to start: ' + (e && e.message ? e.message : 'unknown error'));
  return;
}

(function syncMapToContainer() {
  try {
    var cont = map.getContainer();
    var syncer = function() {
      try { map.resize(); } catch(err) {}
      setTimeout(repositionDomMarkers, 30);
      setTimeout(repositionDomMarkers, 150);
    };
    try { map.on('idle', syncer); } catch(e) {}
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(syncer);
      ro.observe(cont);
    }
    window.addEventListener('resize', syncer);
    window.addEventListener('orientationchange', syncer);
    if (document.readyState !== 'complete') {
      window.addEventListener('load', function() { setTimeout(syncer, 50); });
    }
    setTimeout(syncer, 50);
    setTimeout(syncer, 300);
    setTimeout(syncer, 1200);
  } catch(e) {}
})();

var started = false;
var watchdog = null;
function watchStyle() {
  if (started) return;
  clearTimeout(watchdog);
  watchdog = setTimeout(function() {
    var ok = false;
    try { ok = !!(map.isStyleLoaded && map.isStyleLoaded()); } catch(e) {}
    if (ok) { hideStatus(); return; }
    try { map.setStyle(makeStyle(OSM_FALLBACK)); } catch(e) {}
    hideStatus();
  }, 8000);
}
function hideStatus() {
  started = true;
  clearTimeout(watchdog);
  var el = document.getElementById('mb-status');
  if (el) el.style.display = 'none';
}
watchStyle();
map.once('load', hideStatus);
map.once('idle', hideStatus);
map.on('error', function(e) {
  if (started) return;
  var msg = (e && e.error && e.error.message) || '';
  if (!msg && e && e.error && e.error.status) msg = 'HTTP ' + e.error.status;
  mbStatus(msg ? ('Map error: ' + msg) : 'Map error: style/tiles failed to load');
});

var styleEverLoaded = false;
var currentCamera = null;
map.on('style.load', function() {
  styleEverLoaded = true;
  try { setPolylines(currentPolylines); } catch(e) {}
  try {
    if (currentCamera && currentCamera.locked) {
      map.jumpTo({ center: [currentCamera.lng, currentCamera.lat], zoom: currentCamera.zoom });
    }
  } catch(e) {}
  setTimeout(repositionDomMarkers, 60);
  try {
    if (currentUserLocation) {
      userMk = null;
      setUserLocation(currentUserLocation.lat, currentUserLocation.lng);
    }
  } catch(e) {}
});

(function addCredit() {
  try {
    var c = document.createElement('div');
    c.className = 'mb-credit';
    c.textContent = '© OpenStreetMap';
    document.body.appendChild(c);
  } catch(e) {}
})();

var mapReady = false;
var pendingMsgs = [];

function postMsg(type, data) {
  var msg = JSON.stringify({ type: type, data: data || {} });
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(msg);
  }
  if (window.parent && window.parent !== window) {
    window.parent.postMessage(msg, '*');
  }
}

function iconSVG(iconName) {
  var c = '#fff';
  if (iconName === 'post-pin') {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="' + c + '"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
  }
  if (iconName === 'warning') {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><circle cx="12" cy="15.5" r="0.4" fill="' + c + '"/><line x1="12" y1="9" x2="12" y2="14"/></svg>';
  }
  if (iconName === 'shield') {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.4" stroke-linejoin="round"><path d="M12 2 4 5.5V11c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5.5L12 2z"/></svg>';
  }
  if (iconName === 'person' || iconName === 'location') {
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="' + c + '"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
  }
  return '';
}

function esc(s) {
  return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pinHTML(m) {
  var bg = m.animated ? '#EF4444' : (m.color || '#EF4444');
  var ico = iconSVG(m.iconName || 'post-pin') ||
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="' + '#fff' + '"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
  return '<div class="pin" style="color:' + bg + '">' +
    '<div class="pin-head">' + ico + '</div>' +
    '<div class="pin-point"></div>' +
    '</div>';
}

function markerHTML(m) {
  var bg = m.animated ? '#EF4444' : (m.color || '#3B82F6');
  if (m.imageUrl) {
    return '<div class="img-marker">' +
      '<div class="marker-img-wrap">' +
        '<img class="marker-img" src="' + esc(m.imageUrl) + '" onerror="this.parentNode.style.background=\'#EF4444\'"/>' +
      '</div>' +
    '</div>';
  }
  if (m.iconName && m.iconName !== 'shield') {
    return pinHTML(m);
  }
  var ico = iconSVG(m.iconName || '');
  return '<div class="marker" style="background:' + bg + (m.animated ? '' : ';border-color:#fff') + '">' + ico + '</div>';
}

function markerElement(m) {
  var el = document.createElement('div');
  if (m.iconName && m.iconName !== 'shield') {
    el.style.position = 'absolute';
    el.style.cursor = 'pointer';
    el.style.lineHeight = '0';
    el.innerHTML = markerHTML(m);
    return el;
  }
  el.style.position = 'absolute';
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.justifyContent = 'center';
  el.style.cursor = 'pointer';
  el.style.overflow = m.imageUrl ? 'visible' : 'visible';
  el.innerHTML = markerHTML(m);
  return el;
}

var currentBaseStyle = null;
var lastTilesUrl = null;
function setBaseTiles(url) {
  if (!url) url = OSM_FALLBACK;
  lastTilesUrl = url;
  var id = 'tiles:' + url;
  if (currentBaseStyle === id) return;
  currentBaseStyle = id;
  try { map.setStyle(makeStyle(url)); } catch(e) {}
  watchStyle();
}

function applyStyle(key) {
  if (!STYLE_MAP[key]) return;
  // The concrete tile URL sent at runtime (from MapStyleContext) is the source of
  // truth for the base layer, so a style key can never override it back to the
  // hardcoded default (e.g. "satellite" is now Mapbox, not the Esri fallback).
  var url = lastTilesUrl || STYLE_MAP[key];
  var id = (lastTilesUrl ? 'tiles:' : 'style:') + url;
  if (currentBaseStyle === id) return;
  currentBaseStyle = id;
  try { map.setStyle(makeStyle(url)); } catch(e) {}
  watchStyle();
}

function markerAnchor(m) {
  if (m.iconName === 'post-pin' || m.iconName === 'warning' || m.iconName === 'person' || m.iconName === 'location') {
    return 'bottom';
  }
  return 'center';
}

var MBGL3 = !!(maplibregl.version && parseInt(maplibregl.version.split('.')[0], 10) >= 3);
var dragMarkers = [];
var activeMarkers = [];
var markNeed = 0;
var markReadyCount = 0;
var layersEnsured = false;

function svgDataUrl(svg) {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function loadSVGImage(svg, cb) {
  var im = new Image();
  im.onload = function() { cb(im); };
  im.onerror = function() { cb(null); };
  im.src = svgDataUrl(svg);
}

function alreadyExistsError(e) {
  return !!(e && e.message && /already exists/i.test(e.message));
}

function safeAddImage(name, img, opts) {
  try {
    if (map.hasImage(name)) return true;
    map.addImage(name, img, opts);
    return true;
  } catch(e) {
    return alreadyExistsError(e);
  }
}

function pinSVG(color) {
  return '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="92" viewBox="0 0 32 46">' +
    '<path d="M16 45C10.5 31.5 2.8 23.5 2.8 15.8A13.2 13.2 0 0 1 29.2 15.8C29.2 23.5 21.5 31.5 16 45Z" fill="' + color + '" stroke="#FFFFFF" stroke-width="2.6"/>' +
    '<circle cx="16" cy="15.6" r="6.8" fill="#FFFFFF"/>' +
    '<circle cx="16" cy="13" r="2.4" fill="#1e293b"/>' +
    '<path d="M12.6 19.8C12.6 16.6 19.4 16.6 19.4 19.8L19.4 21.2L12.6 21.2Z" fill="#1e293b"/>' +
    '</svg>';
}

function ballSVG(color, glyph) {
  var g = '';
  if (glyph === 'shield') {
    g = '<path d="M16 6.5 9.5 9v5.6c0 4.3 2.8 7.6 6.5 9.6 3.7-2 6.5-5.3 6.5-9.6V9L16 6.5zm0 3.3 4.2 1.6.3 4h-4.5V20h-2.4v-4.6H9.1l.3-4L16 9.8z" fill="#FFFFFF"/>';
  }
  if (glyph === 'person') {
    g = '<circle cx="16" cy="12.2" r="3.6" fill="#FFFFFF"/>' +
      '<path d="M16 17.5c-4.4 0-7 2.6-7 5.4v1h14v-1c0-2.8-2.6-5.4-7-5.4z" fill="#FFFFFF"/>';
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">' +
    '<circle cx="16" cy="16" r="15" fill="' + color + '" stroke="#FFFFFF" stroke-width="2.2"/>' +
    g +
    (glyph ? '' : '<circle cx="16" cy="16" r="4" fill="rgba(255,255,255,0.92)"/>') +
    '</svg>';
}

var pulseSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">' +
  '<circle cx="24" cy="24" r="22" fill="none" stroke="#EF4444" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="5 6"/>' +
  '</svg>';

function paintAvatar(name, url, cb) {
  var fallback = function() {
    loadSVGImage(ballSVG('#EF4444', 'person'), function(im) {
      if (im) {
        cb(safeAddImage(name, im, { pixelRatio: 2 }));
      } else {
        cb(false);
      }
    });
  };
  var im = new Image();
  im.crossOrigin = 'anonymous';
  var settled = false;
  im.onload = function() {
    if (settled) return;
    settled = true;
    try {
      var s = 88;
      var c = document.createElement('canvas');
      c.width = s; c.height = s;
      var x = c.getContext('2d');
      var R = s / 2;
      x.save();
      x.beginPath(); x.arc(R, R, R, 0, Math.PI * 2); x.clip();
      var k = Math.max(s / im.width, s / im.height);
      var w = im.width * k, h = im.height * k;
      x.drawImage(im, (s - w) / 2, (s - h) / 2, w, h);
      x.restore();
      x.beginPath(); x.arc(R, R, R - 1.5, 0, Math.PI * 2);
      x.strokeStyle = '#FFFFFF'; x.lineWidth = 6; x.stroke();
      if (safeAddImage(name, x.getImageData(0, 0, s, s), { pixelRatio: 2 })) {
        cb(true);
      } else {
        fallback();
      }
    } catch(e) {
      fallback();
    }
  };
  im.onerror = function() {
    if (settled) return;
    settled = true;
    fallback();
  };
  im.src = url;
}

function markerIconName(m) {
  var key;
  if (m.imageUrl) key = 'img_' + m.imageUrl;
  else if (m.iconName === 'post-pin' || m.iconName === 'warning' || m.iconName === 'person' || m.iconName === 'location')
    key = 'pin_' + (m.animated ? '#EF4444' : (m.color || '#EF4444'));
  else if (m.iconName === 'shield')
    key = 'ball_' + (m.color || '#3B82F6') + '_shield';
  else
    key = 'ball_' + (m.color || '#3B82F6');
  return 'm_' + key.replace(/[^A-Za-z0-9_.]/g, '_');
}

function ensureMarkerIcon(m, cb) {
  var name = markerIconName(m);
  try {
    if (map.hasImage(name)) { m._icon = name; cb(true); return; }
  } catch(e) {}
  var finish = function(ok) { if (ok) { m._icon = name; } else { m._icon = 'm_ball__EF4444'; } cb(ok); };
  try {
    if (m.imageUrl) {
      paintAvatar(name, m.imageUrl, finish);
      return;
    }
    var svg;
    if (m.iconName === 'post-pin' || m.iconName === 'warning' || m.iconName === 'person' || m.iconName === 'location') {
      svg = pinSVG(m.animated ? '#EF4444' : (m.color || '#EF4444'));
    } else if (m.iconName === 'shield') {
      svg = ballSVG(m.color || '#3B82F6', 'shield');
    } else {
      svg = ballSVG(m.color || '#3B82F6', null);
    }
    loadSVGImage(svg, function(im) {
      if (im) {
        finish(safeAddImage(name, im, { pixelRatio: 2 }));
      } else {
        finish(false);
      }
    });
  } catch(e) { finish(false); }
}

var defBallLoaded = false;
function ensureDefBall() {
  if (defBallLoaded) return;
  if (map.hasImage && map.hasImage('m_ball__EF4444')) { defBallLoaded = true; return; }
  try {
    loadSVGImage(ballSVG('#EF4444', null), function(im) {
      if (im) {
        defBallLoaded = true;
        safeAddImage('m_ball__EF4444', im, { pixelRatio: 2 });
        applyMarkers();
      }
    });
  } catch(e) {}
}

function ensureCanvasLayers() {
  ensureDefBall();
  try {
    if (!map.hasImage('m_pulse')) {
      loadSVGImage(pulseSVG, function(im) { if (im) safeAddImage('m_pulse', im, { pixelRatio: 2 }); });
    }
  } catch(e) {}
  if (!map.getSource('mark-src')) {
    try { map.addSource('mark-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } }); } catch(e) {}
  }
  if (layersEnsured) return;
  var overlap = MBGL3 ? { 'icon-overlap': 'always' } : { 'icon-allow-overlap': true };
  if (!map.getLayer('mark-layer')) {
    try {
      map.addLayer({
        id: 'mark-layer', type: 'symbol', source: 'mark-src',
        layout: Object.assign({}, overlap, {
          'icon-image': ['get', 'icon'],
          'icon-anchor': ['get', 'anchor'],
          'icon-ignore-placement': true,
          'icon-optional': true
        }),
        paint: { 'icon-opacity': 1 }
      });
    } catch(e) {}
  }
  if (MBGL3 && !map.getLayer('mark-pulse')) {
    try {
      map.addLayer({
        id: 'mark-pulse', type: 'symbol', source: 'mark-src',
        filter: ['==', ['get', 'animated'], true],
        layout: Object.assign({}, overlap, {
          'icon-image': 'm_pulse',
          'icon-anchor': 'center',
          'icon-ignore-placement': true,
          'icon-optional': true
        }),
        paint: {
          'icon-size': ['interpolate', ['linear'], ['get', 'pu'], 0, 0.5, 1, 1.9],
          'icon-opacity': ['interpolate', ['linear'], ['get', 'pu'], 0, 0.7, 1, 0.05]
        }
      });
    } catch(e) {}
  }
  layersEnsured = true;
  registerLayerEvents();
}

var eventsRegistered = false;
function registerLayerEvents() {
  if (eventsRegistered) return;
  eventsRegistered = true;
  map.on('click', 'mark-layer', function(e) {
    if (!e.features || !e.features.length) return;
    var p = e.features[0].properties;
    if (p.title) {
      try {
        new maplibregl.Popup({ closeButton: true, maxWidth: '240px' })
          .setLngLat(e.lngLat).setHTML('<b>' + esc(p.title) + '</b>').addTo(map);
      } catch(e2) {}
    }
    postMsg('markerPress', { latitude: p.lat, longitude: p.lng });
  });
  try { map.on('mouseenter', 'mark-layer', function() { map.getCanvas().style.cursor = 'pointer'; }); } catch(e) {}
  try { map.on('mouseleave', 'mark-layer', function() { map.getCanvas().style.cursor = ''; }); } catch(e) {}
}

function anyAnimated() {
  for (var i = 0; i < activeMarkers.length; i++) {
    if (activeMarkers[i].animated) return true;
  }
  return false;
}

var pulseAnimId = null;
function updatePulseLoop() {
  var need = anyAnimated();
  if (need && !pulseAnimId) {
    pulseAnimId = requestAnimationFrame(pulseFrame);
  } else if (!need && pulseAnimId) {
    cancelAnimationFrame(pulseAnimId);
    pulseAnimId = null;
  }
}

function pulseFrame(ts) {
  var src = null;
  try { src = map.getSource('mark-src'); } catch(e) {}
  if (src) {
    try {
      var d = src._data;
      if (d && d.features && d.features.length) {
        var t = (ts % 2800) / 2800;
        d.features.forEach(function(f) {
          if (f.properties.animated) f.properties.pu = t;
        });
        src.setData(d);
      }
    } catch(e) {}
  }
  if (anyAnimated()) {
    pulseAnimId = requestAnimationFrame(pulseFrame);
  } else {
    pulseAnimId = null;
  }
}

function applyMarkers() {
  try {
    ensureCanvasLayers();
    if (!map.getSource('mark-src')) return;
    var feats = activeMarkers.map(function(m) {
      return {
        type: 'Feature',
        properties: {
          icon: m._icon || 'm_ball__EF4444',
          anchor: (m.iconName === 'post-pin' || m.iconName === 'warning' || m.iconName === 'person' || m.iconName === 'location') ? 'bottom' : 'center',
          lat: m.latitude, lng: m.longitude,
          title: m.title || '',
          animated: !!m.animated,
          pu: 0
        },
        geometry: { type: 'Point', coordinates: [m.longitude, m.latitude] }
      };
    });
    map.getSource('mark-src').setData({ type: 'FeatureCollection', features: feats });
    updatePulseLoop();
    window.__markerCount = feats.length;
  } catch(e) {}
}

var canvasLoadActive = false;
var canvasDirty = false;
function markOneDone() {
  markReadyCount++;
  if (markReadyCount >= markNeed) {
    canvasLoadActive = false;
    var again = canvasDirty;
    canvasDirty = false;
    applyMarkers();
    if (again) loadCanvasMarkers();
  }
}

function loadCanvasMarkers() {
  if (!map) return;
  if (canvasLoadActive) { canvasDirty = true; return; }
  if (!styleEverLoaded) { setTimeout(loadCanvasMarkers, 300); return; }
  canvasLoadActive = true;
  ensureDefBall();
  if (!activeMarkers.length) {
    applyMarkers();
    canvasLoadActive = false;
    if (canvasDirty) { canvasDirty = false; loadCanvasMarkers(); }
    return;
  }
  markNeed = activeMarkers.length;
  markReadyCount = 0;
  setTimeout(function() {
    if (markReadyCount < markNeed) {
      canvasLoadActive = false;
      applyMarkers();
    }
  }, 2500);
  activeMarkers.forEach(function(m) {
    try { ensureMarkerIcon(m, markOneDone); } catch(e) { markOneDone(); }
  });
}

function clearDomMarkers() {
  dragMarkers.forEach(function(mk) { try { mk.remove(); } catch(e) {} });
  dragMarkers = [];
}

function repositionDomMarkers() {
  try {
    dragMarkers.forEach(function(mk) {
      var ll = mk.getLngLat();
      mk.setLngLat([ll.lng, ll.lat]);
    });
  } catch(e) {}
  try {
    if (userMk) {
      var ul = userMk.getLngLat();
      userMk.setLngLat([ul.lng, ul.lat]);
    }
  } catch(e) {}
}

function doAddMarkers(list) {
  clearDomMarkers();
  activeMarkers = [];
  (list || []).forEach(function(m) {
    var lat = Number(m.latitude);
    var lng = Number(m.longitude);
    if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return;
    try {
      var el = markerElement(m);
      var mk = new maplibregl.Marker({ element: el, anchor: markerAnchor(m), draggable: !!m.draggable })
        .setLngLat([lng, lat])
        .addTo(map);
      if (m.title) mk.setPopup(new maplibregl.Popup({ offset: 18, closeButton: true, maxWidth: '240px' }).setHTML('<b>' + esc(m.title) + '</b>'));
      el.addEventListener('click', function(ev) { ev.stopPropagation(); postMsg('markerPress', { latitude: lat, longitude: lng }); });
      mk.on('dragend', function() {
        var ll = mk.getLngLat();
        postMsg('markerDragEnd', { latitude: ll.lat, longitude: ll.lng });
      });
      dragMarkers.push(mk);
    } catch(e) {}
  });
  tryFitOnce();
  setTimeout(repositionDomMarkers, 120);
  setTimeout(repositionDomMarkers, 400);
  postMsg('markerCount', { count: dragMarkers.length });
}

var didAutoFit = false;
var lastFitSig = '';
function autoFitPoints() {
  var pts = dragMarkers.map(function(mk) { return mk.getLngLat(); });
  if (currentUserLocation) pts.push({ lat: currentUserLocation.lat, lng: currentUserLocation.lng });
  return pts.filter(function(p) { return p && isFinite(p.lat) && isFinite(p.lng) && (p.lng || p.lat); });
}
function autoFitSig() {
  return (dragMarkers.length > 0 ? dragMarkers.length : '0') + (currentUserLocation ? ':U' : '');
}
function tryFitOnce() {
  var pts = autoFitPoints();
  if (!pts.length) return;
  var sig = autoFitSig();
  if (sig === lastFitSig) return;
  if (pts.length === 1) {
    map.jumpTo({ center: [pts[0].lng, pts[0].lat], zoom: 15 });
  } else {
    var b = new maplibregl.LngLatBounds();
    pts.forEach(function(p) { b.extend([p.lng, p.lat]); });
    try {
      map.fitBounds(b, { padding: { top: 70, bottom: 70, left: 70, right: 70 }, maxZoom: 15.5, duration: 0 });
    } catch(e) {
      try { map.jumpTo({ center: b.getCenter(), zoom: 14 }); } catch(e2) {}
    }
  }
  lastFitSig = sig;
  didAutoFit = true;
}

function addMarkers(list) {
  doAddMarkers(list);
}

var userMk = null;
var currentUserLocation = null;
function setUserLocation(lat, lng) {
  if (lat == null || lng == null) {
    currentUserLocation = null;
    if (userMk) { try { userMk.remove(); } catch(e) {} userMk = null; }
    return;
  }
  currentUserLocation = { lat: lat, lng: lng };
  if (!userMk) {
    var el = document.createElement('div');
    el.style.width = '18px';
    el.style.height = '18px';
    el.style.display = 'flex';
    el.style.alignItems = 'center';
    el.style.justifyContent = 'center';
    el.innerHTML = '<span class="user-dot"></span>';
    userMk = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([lng, lat])
      .addTo(map);
  } else {
    userMk.setLngLat([lng, lat]);
  }
  tryFitOnce();
  setTimeout(repositionDomMarkers, 120);
  setTimeout(repositionDomMarkers, 400);
  postMsg('userMarkerCount', { count: userMk ? 1 : 0 });
}

var currentPolylines = [];
function setPolylines(list) {
  currentPolylines = list || [];
  try { if (map.getLayer('route-layer')) map.removeLayer('route-layer'); } catch(e) {}
  try { if (map.getSource('route')) map.removeSource('route'); } catch(e) {}
  if (!currentPolylines.length) return;
  var feats = currentPolylines.map(function(p) {
    return {
      type: 'Feature',
      properties: { color: p.color || '#3B82F6', width: p.width || 4 },
      geometry: { type: 'LineString', coordinates: (p.coordinates || []) }
    };
  });
  try {
    map.addSource('route', { type: 'geojson', data: { type: 'FeatureCollection', features: feats } });
    map.addLayer({
      id: 'route-layer',
      type: 'line',
      source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': ['get', 'color'], 'line-width': ['get', 'width'], 'line-opacity': 0.85 }
    });
  } catch(e) {}
}

function applyInteractive(it) {
  // Drag to move is allowed; rotation and pitch stay locked; only zoom in/out + drag.
  try { map.dragPan.enable(); } catch(e) {}
  try { map.dragRotate.disable(); } catch(e) {}
  try { map.touchPitch && map.touchPitch.disable(); } catch(e) {}
  try { map.touchZoomRotate && map.touchZoomRotate.enable(); } catch(e) {}
  try { map.touchZoomRotate && map.touchZoomRotate.disableRotation(); } catch(e) {}
  try { map.doubleClickZoom.enable(); } catch(e) {}
  try { map.scrollZoom.enable(); } catch(e) {}
  try { map.touchZoom.enable(); } catch(e) {}
  try { map.boxZoom.enable(); } catch(e) {}
  try { map.keyboard.disable(); } catch(e) {}
}

var cameraLocked = false;
function applyMsg(msg) {
  try {
    if (msg.type === 'init' && msg.region) {
      currentCamera = {
        lat: msg.region.latitude,
        lng: msg.region.longitude,
        zoom: msg.region.zoom != null ? msg.region.zoom : map.getZoom(),
        locked: true
      };
      try { map.setPitch(0); map.setBearing(0); } catch(e) {}
      if (!cameraLocked) {
        map.setCenter([msg.region.longitude, msg.region.latitude]);
        if (msg.region.zoom != null) map.setZoom(msg.region.zoom);
      }
      if (msg.interactive) applyInteractive(msg.interactive);
      cameraLocked = true;
      return;
    }
    if (msg.type === 'tiles') {
      setBaseTiles(msg.url);
    }
    if (msg.type === 'setStyle') {
      applyStyle(msg.style);
    }
    if (msg.type === 'markers') {
      doAddMarkers(msg.data || []);
    }
    if (msg.type === 'polylines') {
      setPolylines(msg.data || []);
    }
    if (msg.type === 'userLocation') {
      setUserLocation(msg.latitude, msg.longitude);
    }
    if (msg.type === 'focus' && msg.latitude != null && msg.longitude != null) {
      if (msg.north != null && msg.south != null && msg.east != null && msg.west != null) {
        var fbb = new maplibregl.LngLatBounds([msg.west, msg.south], [msg.east, msg.north]);
        currentCamera = { lat: (msg.north + msg.south) / 2, lng: (msg.east + msg.west) / 2, zoom: msg.zoom != null ? msg.zoom : map.getZoom(), locked: true };
        try {
          map.fitBounds(fbb, { padding: { top: 50, bottom: 50, left: 50, right: 50 }, maxZoom: 16, duration: 0 });
        } catch(e) {
          try { map.jumpTo({ center: fbb.getCenter(), zoom: msg.zoom != null ? msg.zoom : 14, pitch: 0, bearing: 0 }); } catch(e2) {}
        }
      } else {
        var fz = msg.zoom != null ? msg.zoom : map.getZoom();
        currentCamera = { lat: msg.latitude, lng: msg.longitude, zoom: fz, locked: true };
        try {
          map.jumpTo({ center: [msg.longitude, msg.latitude], zoom: fz, pitch: 0, bearing: 0 });
        } catch(e) {}
      }
    }
    if (msg.type === 'regionChange') {
      if (cameraLocked) return;
      map.setCenter([msg.longitude, msg.latitude]);
      if (msg.zoom != null) map.setZoom(msg.zoom);
    }
  } catch(err) {}
}

function markReady() {
  if (mapReady) return;
  mapReady = true;
  while (pendingMsgs.length) applyMsg(pendingMsgs.shift());
  postMsg('ready', {});
}
map.on('load', markReady);
setTimeout(markReady, 600);

function onRCMessage(e) {
  try {
    var msg = JSON.parse(e.data);
    if (!mapReady) {
      pendingMsgs.push(msg);
      return;
    }
    applyMsg(msg);
  } catch(err) {}
}
window.addEventListener('message', onRCMessage);
document.addEventListener('message', onRCMessage);
}
startMap();
});
})();
</script>
</body>
